<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改商品</title>
<link rel="stylesheet" href="../../assets/antd.css">
</head>
<body>
<div class="page">
  <div class="page-header"><h2>修改商品</h2><div class="breadcrumb">首页 / 商品管理 / 商品列表 / 修改商品</div></div>

  <div class="steps">
    <div class="step active"><span class="num">1</span>填写商品信息</div>
    <div class="step"><span class="num">2</span>填写商品促销</div>
    <div class="step"><span class="num">3</span>填写商品属性</div>
    <div class="step"><span class="num">4</span>选择商品关联</div>
  </div>

  <div class="card">
    <div class="card-title">商品信息</div>
    <div class="form-row"><div class="form-label required">所属分类</div><div class="form-control">
      <select class="select"><option>手机数码</option><option>家用电器</option><option>服装鞋包</option></select>
    </div></div>
    <div class="form-row"><div class="form-label required">商品名称</div><div class="form-control">
      <input class="input" value="华为 Mate 60 Pro 5G 手机">
    </div></div>
    <div class="form-row"><div class="form-label">副标题</div><div class="form-control">
      <input class="input" value="鸿蒙旗舰 卫星通信 超可靠玄武架构">
    </div></div>
    <div class="form-row"><div class="form-label required">商品品牌</div><div class="form-control">
      <select class="select"><option>华为</option><option>小米</option><option>苹果</option></select>
    </div></div>
    <div class="form-row"><div class="form-label">商品介绍</div><div class="form-control">
      <textarea class="input" rows="4">华为 Mate 60 Pro 搭载全新玄武架构，支持卫星通信，影像旗舰性能强劲。</textarea>
    </div></div>
    <div class="form-row"><div class="form-label required">商品货号</div><div class="form-control">
      <input class="input" value="HW-M60-001">
    </div></div>
    <div class="form-row"><div class="form-label required">商品售价</div><div class="form-control">
      <input class="input" value="6999.00"><div class="form-tip">单位：元</div>
    </div></div>
    <div class="form-row"><div class="form-label">市场价</div><div class="form-control">
      <input class="input" value="7299.00"><div class="form-tip">单位：元</div>
    </div></div>
    <div class="form-row"><div class="form-label required">商品库存</div><div class="form-control">
      <input class="input" value="320">
    </div></div>
    <div class="form-row"><div class="form-label">计量单位</div><div class="form-control">
      <input class="input" value="台">
    </div></div>
    <div class="form-row"><div class="form-label">商品重量</div><div class="form-control">
      <input class="input" value="0.22"><div class="form-tip">单位：kg</div>
    </div></div>
    <div class="form-row"><div class="form-label">排序</div><div class="form-control">
      <input class="input" value="10">
    </div></div>
    <div class="form-row"><div class="form-label">是否上架</div><div class="form-control">
      <span class="switch"></span>
    </div></div>
    <div class="form-row"><div class="form-label"></div><div class="form-control">
      <button class="btn btn-primary">下一步</button>
      <button class="btn">返回</button>
    </div></div>
  </div>
</div>
</body>
</html>
